services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cloudscope:cloudscope@postgres:5432/cloudscope
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cloudscope
      POSTGRES_USER: cloudscope
      POSTGRES_PASSWORD: cloudscope
    volumes: ["cloudscope-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudscope"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  cloudscope-db:
